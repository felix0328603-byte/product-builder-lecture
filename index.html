<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotto & Animal Face Test</title>
    
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3192105713567012" crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-3192105713567012">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌞</button>
        <h1>Lotto Number Generator</h1>
        <div id="numbers" class="numbers-container"></div>
        <button id="generate">Generate Numbers</button>
    </div>

    <!-- Animal Face Test Section -->
    <div class="container">
        <h2>AI Animal Face Test</h2>
        <p>Upload a photo to see if you're a Dog or a Cat face!</p>
        
        <div class="upload-section">
            <input type="file" id="image-upload" accept="image/*" style="display: none;">
            <button type="button" id="upload-trigger">Choose Image</button>
        </div>

        <div id="image-preview-container" style="margin: 1.5rem auto; display: none;">
            <img id="face-image" src="" alt="Preview" style="max-width: 100%; border-radius: 10px; border: 4px solid var(--button-bg);">
        </div>

        <div id="label-container"></div>
    </div>

    <div class="container">
        <h2>Partnership Inquiry</h2>
        <form action="https://formspree.io/f/mpqnqzqy" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required placeholder="Your Name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="_replyto" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="How can we partner together?"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </div>

    <div class="container">
        <h2>Comments</h2>
        <div id="disqus_thread"></div>
        <script>
            (function() {
                var d = document, s = d.createElement('script');
                s.src = 'https://productbuilder.disqus.com/embed.js';
                s.setAttribute('data-timestamp', +new Date());
                (d.head || d.body).appendChild(s);
            })();
        </script>
        <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </div>

    <!-- External Libraries for AI -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    
    <!-- App Scripts -->
    <script src="main.js"></script>
    <script src="animal-test.js"></script>
</body>
</html>
